name: Sync Upstream

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      TARGET_BRANCH: main
      SYNC_BRANCH: auto_fix
      UPSTREAM_REMOTE: upstream
      UPSTREAM_REPO: https://github.com/sebastianromerocruz/CS-3113-Intro-To-Game-Programming.git
      UPSTREAM_BRANCH: main
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure upstream remote
        shell: bash
        run: |
          set -euo pipefail
          git remote add "${UPSTREAM_REMOTE}" "${UPSTREAM_REPO}" 2>/dev/null || git remote set-url "${UPSTREAM_REMOTE}" "${UPSTREAM_REPO}"
          git fetch "${UPSTREAM_REMOTE}" "${UPSTREAM_BRANCH}"
          git fetch origin "${TARGET_BRANCH}"
          git fetch origin "${SYNC_BRANCH}" || true

      - name: Evaluate upstream delta
        id: delta
        shell: bash
        run: |
          set -euo pipefail
          ahead=$(git rev-list --count "origin/${TARGET_BRANCH}".."${UPSTREAM_REMOTE}/${UPSTREAM_BRANCH}")
          if [ "$ahead" -eq 0 ]; then
            echo "Upstream is not ahead; skipping sync." >&2
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream ahead by ${ahead} commit(s)." >&2
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upstream already synced
        if: steps.delta.outputs.needs_sync != 'true'
        run: echo "No upstream updates detected."

      - name: Remove existing sync branch
        if: steps.delta.outputs.needs_sync == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --heads origin "${SYNC_BRANCH}" | grep -q "${SYNC_BRANCH}"; then
            git push origin --delete "${SYNC_BRANCH}" || true
            echo "Removed remote branch ${SYNC_BRANCH}."
          else
            echo "No remote ${SYNC_BRANCH} branch to remove."
          fi
          if git show-ref --verify --quiet "refs/heads/${SYNC_BRANCH}"; then
            git branch -D "${SYNC_BRANCH}"
            echo "Removed local branch ${SYNC_BRANCH}."
          fi

      - name: Prepare sync branch
        if: steps.delta.outputs.needs_sync == 'true'
        id: prepare_merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${SYNC_BRANCH}" "origin/${TARGET_BRANCH}"
          if git merge "${UPSTREAM_REMOTE}/${UPSTREAM_BRANCH}" --no-commit --no-ff; then
            echo "merge_state=clean" >> "$GITHUB_OUTPUT"
          else
            echo "merge_state=conflicts" >> "$GITHUB_OUTPUT"
            echo "Merge has conflicts; leaving resolution to Claude." >&2
          fi

      - name: Run Claude Sync
        if: steps.delta.outputs.needs_sync == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            You are automating the upstream sync triage for repository ${{ github.repository }}.

            Context:
            - Source branch: "${{ env.UPSTREAM_REMOTE }}/${{ env.UPSTREAM_BRANCH }}"
            - Working sync branch (push target): "${{ env.SYNC_BRANCH }}" on origin
            - Base branch for PR: "${{ env.TARGET_BRANCH }}"
            - Preliminary merge status: `${{ steps.prepare_merge.outputs.merge_state }}` (merge applied via `git merge --no-commit --no-ff`)

            Guiding principles:
            - Treat `origin/${{ env.TARGET_BRANCH }}` as the canonical record of completed coursework. Do not overwrite solved exercises, removed TODOs, or other deliberate local edits with upstream placeholders.
            - Pull in upstream additions such as new assignments, assets, or instructor fixes that complement the existing solutions.
            - When both sides modify the same file, start from the local version and carefully splice in upstream improvements (e.g., added cleanup calls) without regressing the finished work.
            - Prefer additive merges: keep local solutions intact, then append or adapt upstream changes so the resulting file reflects both the student's progress and the new material.
            - Document any trade-offs or manual decisions in the PR body so reviewers understand what stayed local and what came from upstream.

            Objectives:
            1. Make sure local refs for `${{ env.TARGET_BRANCH }}`, `${{ env.SYNC_BRANCH }}`, and `${{ env.UPSTREAM_REMOTE }}/{{ env.UPSTREAM_BRANCH }}` are up to date (`git fetch` as needed).
            2. Review the diff between `${{ env.UPSTREAM_REMOTE }}/{{ env.UPSTREAM_BRANCH }}` and `origin/${{ env.TARGET_BRANCH }}`. Ignore generated artifacts such as `*.o`, `*.log`, `build/`, or `bin/` directories.
            3. Identify upstream changes that enrich the course (new exercises, assets, clarifications, bug fixes). Skip anything that would revert completed work unless an upstream fix is required to keep the solution correct.
            4. For each candidate file:
               - Start from the local version (checkout `origin/${{ env.TARGET_BRANCH }}`) and integrate upstream edits manually (`git merge --no-commit`, `git checkout --ours/--theirs`, or manual editing) so local progress is preserved.
               - Use `git cherry-pick`, `git apply`, or direct edits to bring over upstream additions without reintroducing undone TODOs.
               - When upstream updates an existing solution (e.g., adds resource cleanup), weave that change into the local implementation rather than wholesale replacing the file.
            5. Finalize the in-progress merge: resolve conflicts (if any), ensure each file retains the completed coursework while layering in upstream improvements, and commit with a clear message (e.g., "Sync upstream updates").
            6. If additional upstream commits or cherry-picks are appropriate, apply them now.
            7. Prepare reviewer-friendly release notes that call out retained local work and newly imported upstream content.
            8. Check whether a PR from `${{ env.SYNC_BRANCH }}` to `${{ env.TARGET_BRANCH }}` already exists. Update its title/body if it does; otherwise **create one**.
            9. After committing, run `git status --short` to confirm a clean working tree and `git rev-list origin/${{ env.TARGET_BRANCH }}..HEAD` to verify the branch contains new commits. If no commits remain, state that no PR is required and exit.
            10. Force-push `${{ env.SYNC_BRANCH }}` to origin (`git push --force-with-lease origin ${{ env.SYNC_BRANCH }}`).
            11. Ensure a PR exists: use `gh pr view --base ${{ env.TARGET_BRANCH }} --head ${{ env.SYNC_BRANCH }}` and if none is found create one with `gh pr create --base ${{ env.TARGET_BRANCH }} --head ${{ env.SYNC_BRANCH }}` and a body summarizing what you merged, what you left out, and any manual adjustments.
            12. Export `GH_TOKEN="${GH_TOKEN}"` before every `gh` command.
            13. Never merge directly into `${{ env.TARGET_BRANCH }}` from this workflow.

            Conclude with a concise summary of your actions and include the PR URL when applicable.
          claude_args: >-
            --allowed-tools "Bash(git fetch:*),Bash(git remote add:*),Bash(git remote set-url:*),Bash(git remote -v),Bash(git diff:*),Bash(git status),Bash(git checkout:*),Bash(git switch:*),Bash(git reset:*),Bash(git add:*),Bash(git commit:*),Bash(git merge:*),Bash(git cherry-pick:*),Bash(git push:*),Bash(git branch),Bash(git log:*),Bash(git rev-parse:*),Bash(git rev-list:*),Bash(gh auth status),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr edit:*),Bash(gh pr status),Bash(gh pr comment:*),Bash(gh repo view:*),Bash(gh api *),Bash(ls),Bash(ls *),Bash(cat *),Bash(printf *),Bash(jq *)"
     
      - name: Ensure PR from auto_fix → main
        if: steps.delta.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${SYNC_BRANCH}"
          git checkout "${SYNC_BRANCH}"
          git reset --hard "origin/${SYNC_BRANCH}"

          ensure_label() {
            local label="$1"
            local color="$2"
            local desc="$3"
            if ! gh label list --limit 1000 | grep -q "^${label}\b"; then
              gh label create "${label}" --color "${color}" --description "${desc}" || true
            fi
          }

          ensure_label "sync" "0E8A16" "Upstream synchronization changes"
          ensure_label "upstream" "5319E7" "Updates pulled from upstream repository"

          if [ "$(git rev-list --count "origin/${TARGET_BRANCH}..${SYNC_BRANCH}")" -eq 0 ]; then
            echo "No new commits on ${SYNC_BRANCH}; skipping PR creation."
            exit 0
          fi

          if gh pr view --base "${TARGET_BRANCH}" --head "${SYNC_BRANCH}" >/dev/null 2>&1; then
            echo "Updating existing PR for ${SYNC_BRANCH}."
            gh pr edit --base "${TARGET_BRANCH}" --head "${SYNC_BRANCH}" \
              --title "Sync upstream updates" \
              --body "This PR merges upstream improvements while preserving local coursework." \
              --add-label "sync" \
              --add-label "upstream"
          else
            echo "Creating PR for ${SYNC_BRANCH} → ${TARGET_BRANCH}."
            gh pr create --base "${TARGET_BRANCH}" --head "${SYNC_BRANCH}" \
              --title "Sync upstream updates" \
              --body "This PR merges upstream improvements while preserving local coursework." \
              --label "sync" \
              --label "upstream"
          fi
