name: Sync Upstream

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: https://github.com/sebastianromerocruz/CS-3113-Intro-To-Game-Programming.git
      TARGET_BRANCH: main
      SYNC_BRANCH: auto/upstream-sync
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream changes
        id: merge
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch upstream "$TARGET_BRANCH"
          git fetch origin "$TARGET_BRANCH"

          if [ "$(git rev-list --count origin/${TARGET_BRANCH}..upstream/${TARGET_BRANCH})" -eq 0 ]; then
            echo "Nothing to sync; upstream is already merged."
            echo "sync_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -B "$SYNC_BRANCH" "origin/${TARGET_BRANCH}"

          if git merge "upstream/${TARGET_BRANCH}" -X theirs --no-edit; then
            echo "Merge completed without conflicts."
          else
            echo "Merge reported conflicts; resolving by preferring upstream versions."
            while IFS= read -r path; do
              git checkout --theirs "$path"
              git add -f "$path"
            done < <(git diff --name-only --diff-filter=U)
            git commit -m "Merge upstream/${TARGET_BRANCH} into ${TARGET_BRANCH}" || true
          fi

          echo "sync_needed=true" >> "$GITHUB_OUTPUT"
          echo "sync_branch=${SYNC_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "target_branch=${TARGET_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Push sync branch
        if: steps.merge.outputs.sync_needed == 'true'
        run: git push --force --set-upstream origin "$SYNC_BRANCH"