name: Make All Projects

on:
  push:
    branches:
      - main
    paths:
      - '**/*.cpp'
  pull_request:
    paths:
      - '**/*.cpp'

env:
  RAYLIB_VERSION: '5.5'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover make targets
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          readarray -t dirs < <(git ls-files --full-name -- '*[Mm]akefile' | xargs -I{} dirname {} | sort -u)

          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No Makefiles found." >&2
            exit 1
          fi

          json='{"directory":['
          for dir in "${dirs[@]}"; do
            if [ -f "$dir/.skip" ]; then
              continue
            fi
            escaped=$(printf '%s' "$dir" | sed 's/\\/\\\\/g; s/"/\\"/g')
            json+="\"${escaped}\","
          done
          json="${json%,}"
          json+="]}"

          printf 'matrix=%s\n' "$json" >> "$GITHUB_OUTPUT"

  prepare-raylib:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - name: Restore Raylib cache
        uses: actions/cache@v3
        id: raylib-cache
        with:
          path: ~/.local
          key: raylib-${{ runner.os }}-${{ env.RAYLIB_VERSION }}

      - name: Remove man page directories
        run: sudo rm -rf /var/cache/man /var/lib/man /usr/share/man || true

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            build-essential cmake git pkg-config libasound2-dev libpulse-dev
            libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev
            libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev
          version: ${{ env.RAYLIB_VERSION }}

      - name: Build and install Raylib
        if: steps.raylib-cache.outputs.cache-hit != 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local"
          git clone --depth 1 --branch "${RAYLIB_VERSION}" https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=OFF -DBUILD_GAMES=OFF -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          cmake --build /tmp/raylib/build --config Release
          cmake --install /tmp/raylib/build

  build:
    needs:
      - detect
      - prepare-raylib
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Raylib cache
        uses: actions/cache@v3
        with:
          path: ~/.local
          key: raylib-${{ runner.os }}-${{ env.RAYLIB_VERSION }}

      - name: Remove man page directories
        run: sudo rm -rf /var/cache/man /var/lib/man /usr/share/man || true

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            build-essential cmake git pkg-config libasound2-dev libpulse-dev
            libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev
            libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev
          version: ${{ env.RAYLIB_VERSION }}

      - name: Configure build environment
        run: |
          set -euo pipefail
          dir="${{ matrix.directory }}"
          if [ "$dir" = "." ]; then
            artifact="root"
            search_dir="."
          else
            artifact="$dir"
            search_dir="$dir"
          fi
          artifact=${artifact//\//-}
          echo "ARTIFACT_NAME=$artifact" >> "$GITHUB_ENV"
          echo "BUILD_SEARCH_DIR=$search_dir" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$HOME/.local/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/.local/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$HOME/.local/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$HOME/.local:${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=$HOME/.local/include:${CPLUS_INCLUDE_PATH:-}" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run make
        if: matrix.directory != '.'
        working-directory: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          make clean || true
          make

      - name: Run make (root directory)
        if: matrix.directory == '.'
        run: |
          set -euo pipefail
          make clean || true
          make

      - name: Collect build outputs
        if: always()
        run: |
          set -euo pipefail
          dest="${GITHUB_WORKSPACE}/_artifacts/${ARTIFACT_NAME}"
          rm -rf "$dest"
          mkdir -p "$dest"
          search_dir="$BUILD_SEARCH_DIR"
          found=0
          while IFS= read -r file; do
            cp "$file" "$dest/"
            found=1
          done < <(find "$search_dir" -maxdepth 1 -type f \( -name 'raylib_app' -o -name 'raylib_app.exe' -o -perm /111 \)) || true
          if [ $found -eq 0 ]; then
            echo "No build outputs generated in $search_dir" > "$dest/README.txt"
          fi

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ env.ARTIFACT_NAME }}
          path: _artifacts/${{ env.ARTIFACT_NAME }}
          if-no-files-found: warn
          retention-days: 7
