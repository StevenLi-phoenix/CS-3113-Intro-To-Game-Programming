name: Make All Projects

on:
  push:
    branches:
      - main
  pull_request:

env:
  RAYLIB_VERSION: '5.0'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover make targets
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          readarray -t dirs < <(git ls-files --full-name -- '*[Mm]akefile' | xargs -I{} dirname {} | sort -u)

          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No Makefiles found." >&2
            exit 1
          fi

          json='{"directory":['
          for dir in "${dirs[@]}"; do
            escaped=$(printf '%s' "$dir" | sed 's/\\/\\\\/g; s/"/\\"/g')
            json+="\"${escaped}\","
          done
          json="${json%,}"
          json+="]}"

          printf 'matrix=%s\n' "$json" >> "$GITHUB_OUTPUT"

  prepare-raylib:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - name: Restore Raylib cache
        uses: actions/cache@v3
        id: raylib-cache
        with:
          path: ~/.local
          key: raylib-${{ runner.os }}-${{ env.RAYLIB_VERSION }}

      - name: Restore compiler cache
        id: ccache-restore
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-make-all-${{ runner.os }}-${{ env.RAYLIB_VERSION }}-${{ hashFiles('**/Makefile', '**/makefile') }}
          restore-keys: |
            ccache-make-all-${{ runner.os }}-${{ env.RAYLIB_VERSION }}-
            ccache-make-all-${{ runner.os }}-

      - name: Ensure compiler cache directory
        run: mkdir -p ~/.cache/ccache

      - name: Remove man page directories
        run: sudo rm -rf /var/cache/man /var/lib/man /usr/share/man || true

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            build-essential cmake git pkg-config ccache libasound2-dev libpulse-dev
            libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev
            libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev
          version: ${{ env.RAYLIB_VERSION }}

      - name: Configure compiler cache
        run: |
          echo "CC=ccache gcc" >> "$GITHUB_ENV"
          echo "CXX=ccache g++" >> "$GITHUB_ENV"

      - name: Build and install Raylib
        if: steps.raylib-cache.outputs.cache-hit != 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local"
          git clone --depth 1 --branch "${RAYLIB_VERSION}" https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=OFF -DBUILD_GAMES=OFF -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          cmake --build /tmp/raylib/build --config Release
          cmake --install /tmp/raylib/build

      - name: Show ccache stats (prepare)
        run: ccache -s || true

  build:
    needs:
      - detect
      - prepare-raylib
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Raylib cache
        uses: actions/cache@v3
        with:
          path: ~/.local
          key: raylib-${{ runner.os }}-${{ env.RAYLIB_VERSION }}

      - name: Restore compiler cache
        id: ccache-restore
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-make-all-${{ runner.os }}-${{ env.RAYLIB_VERSION }}-${{ hashFiles('**/Makefile', '**/makefile') }}
          restore-keys: |
            ccache-make-all-${{ runner.os }}-${{ env.RAYLIB_VERSION }}-
            ccache-make-all-${{ runner.os }}-

      - name: Ensure compiler cache directory
        run: mkdir -p ~/.cache/ccache

      - name: Remove man page directories
        run: sudo rm -rf /var/cache/man /var/lib/man /usr/share/man || true

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            build-essential cmake git pkg-config ccache libasound2-dev libpulse-dev
            libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev
            libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev
          version: ${{ env.RAYLIB_VERSION }}

      - name: Configure build environment
        run: |
          set -euo pipefail
          echo "PKG_CONFIG_PATH=$HOME/.local/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/.local/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$HOME/.local/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$HOME/.local:${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=$HOME/.local/include:${CPLUS_INCLUDE_PATH:-}" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "CC=ccache gcc" >> "$GITHUB_ENV"
          echo "CXX=ccache g++" >> "$GITHUB_ENV"

      - name: Run make
        if: matrix.directory != '.'
        working-directory: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          make clean || true
          make

      - name: Run make (root directory)
        if: matrix.directory == '.'
        run: |
          set -euo pipefail
          make clean || true
          make

      - name: Show ccache stats (build)
        if: always()
        run: ccache -s || true
