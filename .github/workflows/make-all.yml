name: Make All Projects

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover make targets
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          readarray -t dirs < <(git ls-files --full-name -- '*[Mm]akefile' | xargs -I{} dirname {} | sort -u)

          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No Makefiles found." >&2
            exit 1
          fi

          json='{"directory":['
          for dir in "${dirs[@]}"; do
            escaped=$(printf '%s' "$dir" | sed 's/\\/\\\\/g; s/"/\\"/g')
            json+="\"${escaped}\","
          done
          json="${json%,}"
          json+="]}"

          printf 'matrix=%s\n' "$json" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git pkg-config \
            libasound2-dev libpulse-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev

          git clone --depth 1 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=OFF -DBUILD_GAMES=OFF
          cmake --build /tmp/raylib/build --config Release
          sudo cmake --install /tmp/raylib/build
          sudo ldconfig

      - name: Run make
        if: matrix.directory != '.'
        working-directory: ${{ matrix.directory }}
        run: make

      - name: Run make (root directory)
        if: matrix.directory == '.'
        run: make
